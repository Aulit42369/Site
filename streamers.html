  .streamer-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--cyan); color: var(--cyan); display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.3rem; flex-shrink: 0; }

<script>
/* ════════════════════════════════════════════════════════
   ✏️  AJOUTE TES STREAMERS ICI
   ────────────────────────────────────────────────────────
   Pour chaque streamer :
     name        → son pseudo
     url         → le lien vers sa chaîne (Twitch, YouTube...)
     description → une phrase sur pourquoi tu le/la conseilles

   Le plus mis en avant en premier dans la liste.
════════════════════════════════════════════════════════ */
const STREAMERS = [
  // { name: 'Pseudo', url: 'https://www.twitch.tv/pseudo', description: 'Une phrase sur pourquoi tu conseilles cette chaîne.' },
  // Optionnel : ajoute avatar: 'https://...' pour forcer une image précise
  // au lieu de la récupération automatique depuis Twitch.

  { name: 'Hagosan', url: 'https://www.twitch.tv/hagosan', description: 'Tout simplement car elle est la meilleure coupine au monde. Mais aussi une superbe dessinatrice. ', avatar: 'https://static-cdn.jtvnw.net/jtv_user_pictures/ec8488c3-09e4-4a21-b527-53a04251bda5-profile_image-70x70.png' },
  { name: 'Eiwen_', url: 'https://www.twitch.tv/Eiwen_', description: 'La BRO, une artiste rousse, un peu folle mais que j"adore ', avatar: 'https://static-cdn.jtvnw.net/jtv_user_pictures/ea9a9bfa-e8b1-42ee-86fb-ca5d952a5204-profile_image-70x70.png' },
  { name: 'Calo_VT', url: 'https://www.twitch.tv/calo_vt', description: 'Vtubeur, KAYOU Ultime, du fun et et du rire ', avatar: 'https://static-cdn.jtvnw.net/jtv_user_pictures/f8cd62f6-4e9c-473b-a05c-fcd9d51114dd-profile_image-70x70.png' },
  
];

const grid = document.getElementById('streamersGrid');
const empty = document.getElementById('emptyState');

/* Extrait le pseudo depuis une URL Twitch (dernier segment du chemin). */
function twitchUsername(url) {
  try {
    return new URL(url).pathname.split('/').filter(Boolean).pop() || '';
  } catch {
    return '';
  }
}

/* Remplace la lettre par la photo une fois chargée avec succès ;
   si ça échoue (service indisponible, pseudo introuvable...), la
   lettre reste affichée — jamais d'icône d'image cassée. */
function applyAvatarPhoto(avatarEl, photoUrl) {
  const img = new Image();
  img.onload = () => {
    avatarEl.style.backgroundImage = `url('${photoUrl}')`;
    avatarEl.style.backgroundSize = 'cover';
    avatarEl.style.backgroundPosition = 'center';
    avatarEl.textContent = '';
  };
  img.src = photoUrl;
}

/* Affiche "En direct" ou "Hors ligne" une fois qu'on sait réellement
   lequel des deux s'applique ; le badge reste invisible tant qu'on
   n'a pas de réponse (ou si le service ne répond pas). */
function checkLiveStatus(badgeEl, username) {
  fetch('https://decapi.me/twitch/uptime/' + encodeURIComponent(username) + '?offline_msg=OFFLINE')
    .then(r => (r.ok ? r.text() : Promise.reject()))
    .then(text => {
      const label = badgeEl.querySelector('.label');
      if (text.trim() === 'OFFLINE') {
        badgeEl.classList.add('is-offline');
        label.textContent = 'Hors ligne';
      } else {
        badgeEl.classList.add('is-live');
        label.textContent = 'En direct';
      }
    })
    .catch(() => {});
}

if (STREAMERS.length === 0) {
  empty.style.display = 'block';
} else {
  STREAMERS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card streamer-card';
    const initial = s.name.trim().charAt(0).toUpperCase();
    const avatarId = 'streamer-avatar-' + i;
    const liveId = 'streamer-live-' + i;
    card.innerHTML = `
      <div class="streamer-live-badge" id="${liveId}"><span class="dot"></span><span class="label"></span></div>
      <div class="streamer-avatar" id="${avatarId}">${initial}</div>
      <div class="streamer-name">${s.name}</div>
      <p class="streamer-desc">${s.description}</p>
      <a href="${s.url}" target="_blank" rel="noopener" class="btn btn-secondary">Voir la chaîne</a>
    `;
    grid.appendChild(card);

    const avatarEl = document.getElementById(avatarId);
    const username = twitchUsername(s.url);

    // decapi.me : service tiers gratuit et communautaire, utilisé par
    // beaucoup de streamers pour leurs bots/overlays. Nécessaire ici
    // car Twitch n'expose ni la photo ni le statut live sans clé API,
    // qu'on ne peut pas utiliser en toute sécurité sur un site statique.
    // Si le service ne répond pas : lettre gardée, badge invisible.
    if (s.avatar) {
      applyAvatarPhoto(avatarEl, s.avatar);
    } else if (username) {
      fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(username))
        .then(r => (r.ok ? r.text() : Promise.reject()))
        .then(photoUrl => {
          photoUrl = photoUrl.trim();
          if (photoUrl.startsWith('http')) applyAvatarPhoto(avatarEl, photoUrl);
        })
        .catch(() => {});
    }

    if (username) {
      checkLiveStatus(document.getElementById(liveId), username);
    }
  });
}
</script>
