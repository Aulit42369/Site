<!doctype html>
<!-- Modèle des images d'aperçu (Discord, X, Facebook…) au style 12 « Actuel + Verre » ; rendu par scripts/generer-og.js -->
<html lang="fr"><head><meta charset="utf-8"><title>Aperçu</title>
<style>
@font-face{font-family:'Saira Condensed';font-weight:800;src:url(../../fonts/saira-condensed-latin-800-normal.woff2)}
@font-face{font-family:'Saira Condensed';font-weight:600;src:url(../../fonts/saira-condensed-latin-600-normal.woff2)}
@font-face{font-family:'Rajdhani';font-weight:600;src:url(../../fonts/rajdhani-latin-600-normal.woff2)}
:root{--cyan:#2ee6e0;--mag:#ff3d9a;--vio:#a24bff;--sun1:#ff4d6d;--sun2:#ffb648}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Rajdhani',sans-serif;color:#f1eeff;background:
  radial-gradient(380px 380px at 10% 12%,rgba(162,75,255,.62),transparent 70%),
  radial-gradient(340px 340px at 86% 14%,rgba(46,230,224,.42),transparent 70%),
  radial-gradient(420px 300px at 50% 46%,rgba(120,70,220,.42),transparent 70%),
  radial-gradient(360px 360px at 92% 78%,rgba(110,80,230,.5),transparent 70%),
  radial-gradient(360px 320px at 6% 88%,rgba(46,230,224,.38),transparent 70%),
  radial-gradient(360px 300px at 66% 104%,rgba(255,61,154,.3),transparent 70%),#0d0a1c}
.horizon{position:absolute;left:0;right:0;bottom:0;height:300px;overflow:hidden}
.sun{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);width:250px;height:250px;border-radius:50%;
  background:linear-gradient(180deg,var(--sun2),var(--sun1) 42%,var(--mag) 80%);
  -webkit-mask:linear-gradient(#000 62%,transparent),repeating-linear-gradient(0deg,#000 0 9px,transparent 9px 16px);
  -webkit-mask-composite:source-in;opacity:.85;filter:drop-shadow(0 0 60px rgba(255,77,109,.5))}
.grid{position:absolute;left:-15%;right:-15%;bottom:0;height:200px;opacity:.9;
  background:linear-gradient(90deg,transparent,var(--vio),transparent) 0 0/100% 2px no-repeat,
    repeating-linear-gradient(90deg,transparent 0 58px,rgba(162,75,255,.75) 58px 60px),
    repeating-linear-gradient(0deg,transparent 0 30px,rgba(46,230,224,.55) 30px 32px);
  transform:perspective(420px) rotateX(62deg);transform-origin:bottom;-webkit-mask:linear-gradient(0deg,#000,transparent)}
.plaque{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:960px;padding:46px 56px 44px;text-align:center;border-radius:28px;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.04) 45%,rgba(255,255,255,.08)),rgba(13,10,28,.42);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(22px) saturate(170%)}
.plaque::before{content:'';position:absolute;left:40px;right:40px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--mag))}
.sur{font:600 24px/1 'Saira Condensed',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.sur .m{color:var(--mag)}
h1{margin-top:16px;font:italic 800 132px/.9 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.005em;padding:0 .06em;
  background:linear-gradient(177deg,#fff 2%,#d6fbff 26%,var(--cyan) 46%,#c9b3ff 54%,var(--mag) 74%,#ffe9f4 98%);
  -webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(162,75,255,.45)) drop-shadow(3px 4px 0 rgba(255,61,154,.35))}
h1.long{font-size:104px}
.sous{margin-top:22px;font-size:31px;line-height:1.25;color:#e2dcff}
.pied{position:absolute;left:0;right:0;bottom:26px;text-align:center;font:600 22px/1 'Saira Condensed',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#f1eeff}
.pied b{display:inline-block;padding:9px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(13,10,28,.6);font-weight:600}
</style></head>
<body>
<div class="horizon"><span class="sun"></span><span class="grid"></span></div>
<div class="plaque"><p class="sur" id="sur"></p><h1 id="titre"></h1><p class="sous" id="sous"></p></div>
<p class="pied"><b>aulit42369.fr · twitch.tv/aulit42369</b></p>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('sur').innerHTML = q.get('sur');
const t = document.getElementById('titre'); t.textContent = q.get('titre'); if (t.textContent.length > 10) t.className = 'long';
document.getElementById('sous').textContent = q.get('sous');
</script>
</body></html>
