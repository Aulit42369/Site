name: Vérification des liens internes

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Vérifier les liens internes
        run: node scripts/check-internal-links.js
