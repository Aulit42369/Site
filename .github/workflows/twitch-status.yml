name: Mise à jour statut Twitch

on:
  schedule:
    # Décalé de 4 min par rapport aux horaires ronds (:00, :10, :20...) :
    # GitHub signale que les crons qui tombent pile sur ces horaires
    # subissent plus de retards, vu le nombre de dépôts qui les utilisent
    # aussi. Toujours un rythme de 10 min, juste déphasé.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer les données Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/update-twitch-status.js

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/twitch-status.json
          git add data/broken-links.json
          git add data/recent-games.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Mise à jour statut Twitch [skip ci]"
          git push
