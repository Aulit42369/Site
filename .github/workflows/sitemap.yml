name: Plan du site (sitemap.xml)

# Régénère sitemap.xml quand une page est ajoutée ou retirée depuis l'admin
# (onglet « Pages »), pour que Google la découvre.
on:
  push:
    branches: [main]
    paths:
      - 'data/custom-pages.json'
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Mise à jour du plan du site [skip ci]"
          git pull --rebase origin main
          git push
