name: Plan du site (sitemap.xml)

# Régénère sitemap.xml quand une page est ajoutée ou retirée depuis l'admin
# (onglet « Pages ») ou qu'une page HTML change (lastmod), pour que Google la découvre.
on:
  push:
    branches: [main]
    paths:
      - 'data/custom-pages.json'
      - '*.html'
      - 'scripts/generate-sitemap.js'
  workflow_dispatch:

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historique complet : lastmod = date du dernier commit de chaque page

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Régénérer sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "Mise à jour du plan du site [skip ci]"
          git pull --rebase origin main
          git push
