name: Cache-busting style.css / main.js

on:
  push:
    branches: [main]
    paths:
      - 'style.css'
      - 'main.js'
  workflow_dispatch:

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mettre à jour le "?v=" dans les pages HTML
        run: node scripts/update-asset-versions.js

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --staged --quiet || git commit -m "Mise à jour cache-busting style.css/main.js [skip ci]"
          git push
